name: Chat rooms and general user labels
on:
  pull_request:
    paths: ['web/**', 'server/workspace/**', 'shared/**', 'db/**', 'tests/**', '.github/workflows/chat-rooms.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-rooms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chat-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iharu_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d iharu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm run test:postgres
        env:
          CI: 'true'
          IHARU_CI_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/iharu_ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/chat-rooms.spec.ts tests/e2e/guest-entry.spec.ts tests/e2e/conversation-stickers.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: iharu-ui137-postgres-results, path: test-results/, retention-days: 3}
