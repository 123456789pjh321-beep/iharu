name: Guest entry and contextual login
on:
  pull_request:
    paths: ['web/**', 'shared/entry-intent.ts', 'tests/entry-intent.test.ts', 'tests/e2e/guest-entry.spec.ts', '.github/workflows/guest-entry.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guest-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test -- tests/entry-intent.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/guest-entry.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: iharu-guest-entry-results, path: test-results/, retention-days: 3}
