name: Timeline memos and schedule alerts
on:
  pull_request:
    paths: ['web/**', 'shared/memos.ts', 'server/**', 'db/migrations/**', 'tests/e2e/timeline.spec.ts', 'tests/e2e/notification-calendar.spec.ts', '.github/workflows/timeline-memos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeline-memos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  memo-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/timeline.spec.ts tests/e2e/notification-calendar.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: timeline-memos-ui, path: test-results/, retention-days: 3}
