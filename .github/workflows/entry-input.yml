name: Entry date and time UI
on:
  pull_request:
    paths: ['web/**', 'shared/entry-input.ts', 'tests/e2e/entry-input.spec.ts', 'tests/e2e/timetable-preference.spec.ts', 'tests/e2e/entry-controls.ts', '.github/workflows/entry-input.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/entry-input.spec.ts tests/e2e/timetable-gestures.spec.ts tests/e2e/timetable-visible-hours.spec.ts tests/e2e/timetable-preference.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: entry-input-ui, path: test-results/, retention-days: 3}
