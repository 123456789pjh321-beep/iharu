name: Workspace usability
on:
  pull_request:
    paths: ['web/**', 'shared/**', 'tests/e2e/**', '.github/workflows/usability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/tuition-touch.spec.ts tests/e2e/usability.spec.ts tests/e2e/member-filters.spec.ts tests/e2e/conversation-stickers.spec.ts tests/e2e/timetable-visible-hours.spec.ts tests/e2e/timetable-now.spec.ts tests/e2e/timetable-preference.spec.ts tests/e2e/navigation-updates.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-screenshots-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
