name: iHaru launch and wordmark
on:
  pull_request:
    paths: ['web/**', 'shared/brand.ts', 'scripts/sync-brand-assets.mjs', 'tests/e2e/launch-brand.spec.ts', '.github/workflows/launch-brand.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/launch-brand.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: iharu-launch-wordmark-results, path: test-results/, retention-days: 3}
