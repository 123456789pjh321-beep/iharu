name: Notification and calendar UI
on:
  pull_request:
    paths: ['web/**', 'server/push/**', 'db/migrations/**', 'tests/e2e/notification-calendar.spec.ts', 'tests/e2e/navigation-updates.spec.ts', '.github/workflows/notification-calendar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/notification-calendar.spec.ts tests/e2e/navigation-updates.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: notification-calendar-ui, path: test-results/, retention-days: 3}
