name: Legal content saving and publication
on:
  pull_request:
    paths: ['web/**', 'shared/legal*', 'server/legal/**', 'db/migrations/**', 'tests/legal.test.ts', 'tests/e2e/legal-content-save.spec.ts', '.github/workflows/legal-content.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legal-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/legal-content-save.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: legal-content-results, path: test-results/, retention-days: 3}
