name: Android release kit
on:
  pull_request:
    paths: ['android/**', 'tests/store/**', 'playwright.store.config.ts', '.github/workflows/android-release.yml', 'web/public/**', 'web/index.html', 'vercel.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Find a verified build with unchanged Android inputs
        id: prior
        uses: actions/github-script@v7
        with:
          script: |
            // Reuse unsigned output only when every Android build/test input is unchanged.
            // Bump the artifact name if the Java/Gradle/SDK recipe changes outside android/.
            const {owner,repo}=context.repo;
            const head=context.payload.pull_request?.head.sha || context.sha;
            const artifacts=(await github.rest.actions.listArtifactsForRepo({owner,repo,name:'android-unsigned',per_page:10})).data.artifacts;
            for(const artifact of artifacts){
              if(artifact.expired || !artifact.workflow_run || artifact.workflow_run.head_repository_id!==context.payload.repository.id) continue;
              const runId=artifact.workflow_run.id;
              const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:runId})).data.jobs;
              if(!jobs.some(j=>j.name==='android' && j.conclusion==='success')) continue;
              const base=artifact.workflow_run.head_sha;
              const diff=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:`${base}...${head}`})).data;
              if(!['ahead','identical'].includes(diff.status) || !diff.files || diff.files.length>=300) continue;
              const nativeInput=p=>p.startsWith('android/') && p!=='android/README.md' && !p.startsWith('android/scripts/');
              if(diff.files.some(f=>nativeInput(f.filename) || (f.previous_filename && nativeInput(f.previous_filename)))) continue;
              core.setOutput('run',String(runId));
              core.info(`Reusing verified unchanged Android build from run ${runId}, source ${base}`);
              break;
            }
      - uses: actions/download-artifact@v4
        if: steps.prior.outputs.run != ''
        with:
          name: android-unsigned
          path: android-artifacts/
          run-id: ${{ steps.prior.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        if: steps.prior.outputs.run == ''
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        if: steps.prior.outputs.run == ''
        with: {packages: 'platform-tools', log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.prior.outputs.run == ''
        with: {gradle-version: '8.13'}
      - name: Install SDK
        if: steps.prior.outputs.run == ''
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint unsigned distribution
        if: steps.prior.outputs.run == ''
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest bundleRelease assembleRelease assembleDebug lintRelease
      - name: Verify APK alignment and collect signing tool
        if: steps.prior.outputs.run == ''
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifacts/
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifacts/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-artifacts/
          cp android/app/build/reports/lint-results-release.* android-artifacts/
          cp -r android/app/build/test-results/testDebugUnitTest android-artifacts/
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifacts/
          find android/app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -exec cp {} android-artifacts/AndroidManifest.xml \;
      - uses: actions/upload-artifact@v4
        with: {name: android-unsigned, path: android-artifacts/, retention-days: 7}
  store-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.store.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: store-screenshots, path: test-results/store/, retention-days: 7}

  android-runtime:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/debug/
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 android/scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-${{ matrix.api }}
          path: android-smoke/
          retention-days: 7
