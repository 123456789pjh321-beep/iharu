<!doctype html>
<html lang="ko" class="app-launch-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="아이하루 · 그룹의 하루를 잇다" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>아이하루 · 그룹의 하루를 잇다</title>
    <style>
      html.app-launch-active{overflow:hidden}
      #app-launch{
        --launch-muted:#546e64;--launch-ink:#204c3e;--launch-edge:#d7e7de;--launch-tile:#ffffffde;
        --launch-glow:#e9f5ee;--launch-warm:#f9f4e9;--launch-shadow:#234f3c12;
        position:fixed;inset:0;z-index:10000;display:grid;place-items:center;box-sizing:border-box;
        min-height:100dvh;padding:16px;overflow:auto;background:#fff;color:#176b56;
        opacity:1;transition:opacity .22s ease;font-family:system-ui,sans-serif
      }
      #app-launch[data-intro=welcome]:not([data-state=error]){
        background-image:radial-gradient(ellipse 360px 260px at 46% 47%,var(--launch-glow),transparent),
                         radial-gradient(ellipse 290px 190px at 67% 66%,var(--launch-warm),transparent)
      }
      #app-launch .launch-art{display:grid;justify-items:center;gap:26px;min-width:0;max-width:100%;text-align:center}
      #app-launch .launch-logo{display:block;width:clamp(220px,48vw,420px);max-width:78vw;height:auto;overflow:visible;margin-inline:auto}
      #app-launch .launch-caption{margin:12px 0 0;color:var(--launch-ink);font-size:clamp(15px,3.9vw,19px);font-weight:650;line-height:1.55;letter-spacing:-.035em}
      #app-launch .launch-features{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(344px,calc(100vw - 32px));margin:0;padding:0;list-style:none}
      #app-launch .launch-features::before{content:"";position:absolute;inset:34px 11% auto;height:1px;background:currentColor;opacity:.24;transform-origin:left}
      #app-launch .launch-feature{
        position:relative;display:grid;justify-items:center;gap:9px;padding:12px 4px 11px;
        border:1px solid var(--launch-edge);border-radius:17px;background:var(--launch-tile);box-shadow:0 9px 24px -13px var(--launch-shadow);
        color:var(--launch-ink);font-size:clamp(11px,3vw,13px);font-weight:650;line-height:1.35;white-space:nowrap
      }
      #app-launch .launch-feature-mark{
        --mark-bg:#e0f0e7;--mark-ink:#256650;
        position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;
        color:var(--mark-ink);background:var(--mark-bg)
      }
      #app-launch .launch-feature-mark i{position:relative;display:block;box-sizing:border-box;width:18px;height:18px;border:1.5px solid currentColor;border-radius:4px}
      #app-launch .launch-feature-mark i::before,#app-launch .launch-feature-mark i::after{content:"";position:absolute}
      #app-launch .launch-feature-mark--routine i::before{top:4px;left:4px;width:7px;height:1.5px;background:currentColor;border-radius:1px;box-shadow:0 4px currentColor,0 8px currentColor}
      #app-launch .launch-feature-mark--calendar{--mark-bg:#f6ebd7;--mark-ink:#81551f}
      #app-launch .launch-feature-mark--calendar i::before{top:4px;left:0;right:0;border-top:1.5px solid currentColor}
      #app-launch .launch-feature-mark--calendar i::after{top:8px;left:3px;width:2px;height:2px;border-radius:50%;background:currentColor;box-shadow:4px 0 currentColor,8px 0 currentColor,0 4px currentColor,4px 4px currentColor}
      #app-launch .launch-feature-mark--chat{--mark-bg:#e5edf5;--mark-ink:#315c79}
      #app-launch .launch-feature-mark--chat i{height:15px;border-radius:5px}
      #app-launch .launch-feature-mark--chat i::before{left:3px;bottom:-3px;width:4px;height:4px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;background:var(--mark-bg);transform:skewY(-34deg)}
      #app-launch .launch-feature-mark--chat i::after{left:3px;top:5px;width:2px;height:2px;border-radius:50%;background:currentColor;box-shadow:3.5px 0 currentColor,7px 0 currentColor}
      #app-launch .launch-progress{display:grid;justify-items:center;gap:9px}
      #app-launch .launch-track{width:48px;height:2px;overflow:hidden;border-radius:2px;background:var(--launch-edge)}
      #app-launch .launch-track::after{content:"";display:block;width:40%;height:100%;background:currentColor;border-radius:inherit;animation:iharu-launch-line 1.4s ease-in-out infinite}
      #app-launch .launch-message{margin:0;color:var(--launch-muted);font-size:12px;font-weight:500;line-height:1.7;text-align:center}
      #app-launch .launch-recovery{max-width:300px;text-align:center}
      #app-launch [hidden]{display:none!important}
      #app-launch button{min-height:44px;margin-top:16px;padding:10px 24px;border:1px solid #176b5630;border-radius:12px;color:inherit;background:transparent;font:600 14px system-ui;cursor:pointer}
      #app-launch button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
      #app-launch[data-state=leaving]{opacity:0;pointer-events:none}
      #app-launch[data-state=error] .launch-track{display:none}
      #app-launch[data-intro=compact] :is(.launch-caption,.launch-features),#app-launch[data-state=error] :is(.launch-caption,.launch-features){display:none}
      html[data-theme=dark] #app-launch{
        --launch-muted:#a9beb3;--launch-ink:#d6ece1;--launch-edge:#36564a;--launch-tile:#183029;
        --launch-glow:#204439;--launch-warm:#302b21;--launch-shadow:#0004;
        background-color:#10231e;color:#b3d7c4
      }
      html[data-theme=dark] #app-launch .launch-feature-mark{--mark-bg:#294c3e;--mark-ink:#b8e5ce}
      html[data-theme=dark] #app-launch .launch-feature-mark--calendar{--mark-bg:#4a3c28;--mark-ink:#f4d39f}
      html[data-theme=dark] #app-launch .launch-feature-mark--chat{--mark-bg:#2b4454;--mark-ink:#bbdaef}
      #app-launch[data-intro=welcome] .launch-brand{animation:iharu-launch-in .46s cubic-bezier(.22,1,.36,1) both}
      #app-launch[data-intro=welcome] .launch-feature{animation:iharu-launch-in .4s cubic-bezier(.22,1,.36,1) var(--launch-step,.18s) both}
      #app-launch[data-intro=welcome] .launch-feature:nth-child(2){--launch-step:.27s}
      #app-launch[data-intro=welcome] .launch-feature:nth-child(3){--launch-step:.36s}
      #app-launch[data-intro=welcome] .launch-features::before{animation:iharu-launch-connect .53s ease-out .18s both}
      #app-launch[data-motion=reduced] :is(.launch-brand,.launch-feature),
      #app-launch[data-motion=reduced] .launch-features::before,
      #app-launch[data-motion=reduced] .launch-track::after{animation:none}
      #app-launch[data-motion=reduced]{transition:none}
      @keyframes iharu-launch-in{from{opacity:.12;transform:translateY(9px)}to{opacity:1;transform:none}}
      @keyframes iharu-launch-connect{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes iharu-launch-line{from{transform:translateX(-110%)}to{transform:translateX(360%)}}
      @media(max-height:460px){#app-launch .launch-art{gap:15px}#app-launch .launch-logo{width:min(270px,65vw)}#app-launch .launch-caption{margin-top:6px}}
      @media(prefers-reduced-motion:reduce){
        #app-launch{transition:none}
        #app-launch[data-intro=welcome] :is(.launch-brand,.launch-feature),
        #app-launch[data-intro=welcome] .launch-features::before,#app-launch .launch-track::after{animation:none}
      }
    </style>
  </head>
  <body>
    <div id="app-launch" role="region" aria-label="아이하루 시작" data-state="loading" data-intro="welcome">
      <div class="launch-art">
        <div class="launch-brand">
        <!-- iharu-wordmark:start --><svg class="launch-logo" viewBox="0 0 5033 1532.5" fill="currentColor" aria-hidden="true" focusable="false"><path d="M180.0 232.0V20.0H405.0V232.0ZM180 1482.5V402.5H405V1482.5ZM671 1482.5V42.5H896V656.0H1597.0V42.5H1822V1482.5H1597V867.5H896V1482.5ZM2371.5 1512.5Q2253 1512.5 2171.875 1468.125Q2090.75 1423.75 2049.375 1349.875Q2008.0 1276.0 2008 1187.5Q2008 1107.5 2035.625 1045.375Q2063.25 983.25 2118.625 938.625Q2174.0 894.0 2258.5 866.0Q2327.0 844.75 2416.125 828.375Q2505.25 812.0 2606.75 797.875Q2708.25 783.75 2814.0 768.0L2733 813.5Q2734.25 693.75 2681.125 636.625Q2628 579.5 2500 579.5Q2421 579.5 2351.625 616.375Q2282.25 653.25 2254.5 740.0L2047 675.5Q2086.75 537.5 2199.375 455.0Q2312 372.5 2501 372.5Q2645.75 372.5 2754.0 420.75Q2862.25 469.0 2914.0 576.0Q2941.5 631.0 2947.5 690.25Q2953.5 749.5 2953.5 818.5V1482.5H2755.5V1242.0L2791.0 1277.0Q2721.0 1397.25 2620.375 1454.875Q2519.75 1512.5 2371.5 1512.5ZM2414.0 1331.0Q2499.5 1331.0 2560.5 1300.625Q2621.5 1270.25 2658.25 1224.875Q2695 1179.5 2707 1134.5Q2724.75 1087.5 2727.375 1027.625Q2730.0 967.75 2730 931.5L2801.0 955.0Q2697.0 971.25 2617.375 983.5Q2537.75 995.75 2477.25 1007.375Q2416.75 1019.0 2369.5 1034.0Q2327.25 1049.0 2295.875 1069.375Q2264.5 1089.75 2247.0 1118.0Q2229.5 1146.25 2229.5 1185.0Q2229.5 1225.75 2249.875 1258.875Q2270.25 1292.0 2311.125 1311.5Q2352.0 1331.0 2414.0 1331.0ZM3180 1482.5V402.5H3379.5V665.0L3353.5 631.0Q3373.5 578.0 3406.25 534.0Q3439.0 490.0 3483.5 461.5Q3523.75 432.75 3573.375 417.0Q3623.0 401.25 3675.0 397.75Q3727.0 394.25 3775.5 402.5V613.0Q3725.0 598.75 3661.625 604.5Q3598.25 610.25 3546 642.5Q3495.75 672.25 3465.125 716.875Q3434.5 761.5 3420.5 817.0Q3406.5 872.5 3406.5 935.5V1482.5ZM4338 1512.5Q4222.25 1512.5 4145.125 1474.5Q4068 1436.5 4021.25 1376.125Q3974.5 1315.75 3951.0 1246.375Q3927.5 1177.0 3919.75 1112.625Q3912.0 1048.25 3912.0 1004.0V402.5H4140V928.0Q4140 984.5 4148.875 1048.875Q4157.75 1113.25 4185.0 1170.625Q4212.25 1228.0 4264.25           <p class="launch-caption">가족의 하루를 한곳에</p>
        </div>
        <ul class="launch-features" aria-label="아이하루 주요 기능">
          <li class="launch-feature"><span class="launch-feature-mark launch-feature-mark--routine" aria-hidden="true"><i></i></span>시간표</li>
          <li class="launch-feature"><span class="launch-feature-mark launch-feature-mark--calendar" aria-hidden="true"><i></i></span>가족 달력</li>
          <li class="launch-feature"><span class="launch-feature-mark launch-feature-mark--chat" aria-hidden="true"><i></i></span>가족 대화</li>
        </ul>
        <div class="launch-progress">
          <span class="launch-track" aria-hidden="true"></span>
          <p class="launch-message" id="launch-message" role="status">나의 하루를 준비하고 있어요</p>
        </div>
        <div class="launch-recovery" id="launch-recovery" hidden><p class="launch-message">연결 상태를 확인한 후 다시 시도해 주세요.</p><button type="button" id="launch-retry">다시 시도</button></div>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script>
      // First-paint loading before the app bundle. The welcome animation plays once per tab session.
      (function(){
        var boot=document.getElementById('app-launch'),root=document.getElementById('root'),html=document.documentElement;
        if(!boot||!root)return;
        var started=performance.now(),closed=false,leaving=false,settle=0,watchdog=0,frame=0,fade=0;
        var media=window.matchMedia('(prefers-reduced-motion: reduce)'),quiet=false,firstView=true;
        var retry=document.getElementById('launch-retry');
        try{
          firstView=sessionStorage.getItem('iharu:launch-intro')!=='seen';
          if(firstView)sessionStorage.setItem('iharu:launch-intro','seen');
        }catch(e){}
        if(!/^\/(?:service|guide|notices|blog)(?:\/|$)/.test(location.pathname))firstView=false;
        boot.dataset.intro=firstView?'welcome':'compact';
        try{var pref=JSON.parse(localStorage.getItem('iharu:appearance')||'null');if(pref&&pref.theme==='dark')html.dataset.theme='dark';quiet=!!(pref&&pref.quiet);if(/^\/(service|guide|notices|blog|login|signup)(\/|$)/.test(location.pathname)&&localStorage.getItem('iharu-public-motion')==='off')quiet=true;}catch(e){}
        function reduced(){return quiet||media.matches;}
        function motion(){boot.dataset.motion=reduced()?'reduced':'full';}
        function motionChanged(){motion();clearTimeout(settle);settle=0;queue();}
        motion();
        function remove(){
          if(closed)return;closed=true;clearTimeout(settle);clearTimeout(watchdog);clearTimeout(fade);cancelAnimationFrame(frame);
          observer.disconnect();media.removeEventListener('change',motionChanged);window.removeEventListener('error',bundleError,true);window.removeEventListener('pagehide',remove);
          root.inert=false;root.removeAttribute('aria-hidden');html.classList.remove('app-launch-active');html.dataset.launchState='ready';boot.remove();
        }
        function reveal(){
          if(closed||leaving)return;leaving=true;clearTimeout(settle);clearTimeout(watchdog);observer.disconnect();html.dataset.launchState='leaving';boot.dataset.state='leaving';boot.setAttribute('aria-hidden','true');
          if(reduced()||!firstView||document.visibilityState==='hidden'){remove();return;}
          fade=setTimeout(remove,230);
        }
        function ready(){return root.childElementCount>0&&!root.querySelector('.loading-state,[data-app-loading]');}
        function check(){
          if(closed||leaving)return;
          if(!ready()){clearTimeout(settle);settle=0;return;}
          if(settle)return;
          var welcomeRemaining=firstView&&!reduced()?920-(performance.now()-started):0;
          settle=setTimeout(function(){settle=0;if(ready())reveal();},Math.max(100,welcomeRemaining));
        }
        function queue(){cancelAnimationFrame(frame);frame=requestAnimationFrame(check);}
        function recovery(){
          if(closed||leaving)return;boot.dataset.state='error';document.getElementById('launch-message').textContent='화면을 불러오지 못했어요';document.getElementById('launch-recovery').hidden=false;
        }
        function bundleError(event){if(event.target instanceof HTMLScriptElement&&event.target.type==='module'&&!root.childElementCount)recovery();}
        var observer=new MutationObserver(queue);observer.observe(root,{childList:true,subtree:true});
        media.addEventListener('change',motionChanged);window.addEventListener('error',bundleError,true);window.addEventListener('pagehide',remove);
        retry.addEventListener('click',function(){location.reload();});
        // A slow API yields to the app's own loading/error UI; a missing bundle has a retry screen.
        watchdog=setTimeout(function(){if(root.childElementCount)reveal();else recovery();},8000);
        html.dataset.launchState='loading';queue();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <noscript><style>html.app-launch-active{overflow:auto}#app-launch{display:none}</style><p>아이하루를 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
  </body>
</html>
