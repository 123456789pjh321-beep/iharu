<!doctype html>
<html lang="ko" class="app-launch-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="아이하루 · 그룹의 하루를 잇다" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>아이하루 · 그룹의 하루를 잇다</title>
    <style>
      html.app-launch-active { overflow: hidden; }
      #app-launch {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 16px;
        overflow: auto;
        background: #fff;
        color: #0878ce;
        font-family: system-ui, sans-serif;
      }
      #app-launch .launch-content {
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }
      .iharu-loading-mark {
        display: block;
        flex: none;
        fill: none;
        stroke: #0878ce;
        stroke-width: 5.5;
        stroke-linecap: round;
      }
      .iharu-loading-rays > use {
        stroke-dasharray: 1 1;
        animation: iharu-loading-ray 1.28s linear infinite backwards;
      }
      .iharu-loading-rays > use:nth-child(2) { animation-delay: .16s; }
      .iharu-loading-rays > use:nth-child(3) { animation-delay: .32s; }
      .iharu-loading-rays > use:nth-child(4) { animation-delay: .48s; }
      .iharu-loading-rays > use:nth-child(5) { animation-delay: .64s; }
      .iharu-loading-rays > use:nth-child(6) { animation-delay: .8s; }
      .iharu-loading-rays > use:nth-child(7) { animation-delay: .96s; }
      .iharu-loading-rays > use:nth-child(8) { animation-delay: 1.12s; }
      @keyframes iharu-loading-ray {
        0% { opacity: 0; stroke-dashoffset: 1; }
        18%, 55% { opacity: 1; stroke-dashoffset: 0; }
        100% { opacity: 0; stroke-dashoffset: 0; }
      }
      #app-launch:is([data-motion=reduced], [data-state=error]) .iharu-loading-rays > use,
      html[data-motion=reduced] .iharu-loading-rays > use { animation: none; }
      @media (prefers-reduced-motion: reduce) {
        .iharu-loading-rays > use { animation: none; }
      }
      #app-launch .launch-message {
        margin: 0;
        color: #536677;
        font-size: 14px;
        line-height: 1.5;
      }
      #app-launch .launch-recovery { max-width: 300px; }
      #app-launch button {
        min-height: 44px;
        margin-top: 12px;
        padding: 10px 24px;
        border: 1px solid #c3d9ec;
        border-radius: 12px;
        color: inherit;
        background: transparent;
        font: 600 14px system-ui;
        cursor: pointer;
      }
      #app-launch button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <div id="app-launch" role="region" aria-label="아이하루 시작" data-state="loading">
      <div class="launch-content">
        <svg class="iharu-loading-mark" viewBox="0 0 72 72" width="104" height="104" aria-hidden="true" focusable="false">
          <use href="/brand/iharu-loading-mark.svg#sun-center" />
          <g class="iharu-loading-rays">
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(0 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(45 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(90 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(135 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(180 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(225 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(270 36 36)" />
            <use href="/brand/iharu-loading-mark.svg#sun-ray" transform="rotate(315 36 36)" />
          </g>
        </svg>
        <p class="launch-message" id="launch-message" role="status">아이하루를 불러오고 있어요</p>
        <div class="launch-recovery" id="launch-recovery" hidden>
          <p class="launch-message">연결 상태를 확인한 후 다시 시도해 주세요.</p>
          <button type="button" id="launch-retry">다시 시도</button>
        </div>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script>
      // Cover the initial page until React can display content or its retry controls.
      (function () {
        var boot = document.getElementById('app-launch');
        var root = document.getElementById('root');
        var html = document.documentElement;
        var frame = 0, closed = false;
        try {
          var preference = JSON.parse(localStorage.getItem('iharu:appearance') || 'null');
          if (preference && preference.theme === 'dark') html.dataset.theme = 'dark';
          var publicPage = /^\/(service|guide|notices|blog|login|signup)(\/|$)/.test(location.pathname);
          if ((preference && preference.quiet) || (publicPage && localStorage.getItem('iharu-public-motion') === 'off')) {
            boot.dataset.motion = 'reduced';
          }
        } catch (error) {}

        function remove() {
          if (closed) return;
          closed = true;
          clearTimeout(watchdog);
          cancelAnimationFrame(frame);
          observer.disconnect();
          window.removeEventListener('error', bundleError, true);
          window.removeEventListener('pagehide', remove);
          root.inert = false;
          root.removeAttribute('aria-hidden');
          html.classList.remove('app-launch-active');
          html.dataset.launchState = 'ready';
          boot.remove();
        }
        function queue() {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(function () {
            if (root.firstElementChild && !root.querySelector('[data-app-loading]')) remove();
          });
        }
        function recovery() {
          if (closed) return;
          boot.dataset.state = 'error';
          document.getElementById('launch-message').textContent = '화면을 불러오지 못했어요';
          document.getElementById('launch-recovery').hidden = false;
        }
        function bundleError(event) {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module' && !root.firstElementChild) {
            recovery();
          }
        }
        var observer = new MutationObserver(queue);
        observer.observe(root, {childList: true, subtree: true});
        window.addEventListener('error', bundleError, true);
        window.addEventListener('pagehide', remove);
        document.getElementById('launch-retry').addEventListener('click', function () { location.reload(); });
        // Yield to React for a slow API. A missing bundle needs its own retry control.
        var watchdog = setTimeout(function () { if (root.firstElementChild) remove(); else recovery(); }, 8000);
        html.dataset.launchState = 'loading';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <noscript><style>html.app-launch-active{overflow:auto}#app-launch{display:none}</style><p>아이하루를 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
  </body>
</html>
