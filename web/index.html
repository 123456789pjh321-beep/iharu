<!doctype html>
<html lang="ko" class="app-launch-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="아이하루 · 가족의 하루를 잇다" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>아이하루 · 가족의 하루를 잇다</title>
    <style>
      html.app-launch-active{overflow:hidden}
      #app-launch{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;box-sizing:border-box;min-height:100dvh;padding:28px;background:#fff;color:#176b56;opacity:1;transition:opacity .28s ease,transform .28s ease;font-family:system-ui,sans-serif}
      #app-launch .launch-art{display:flex;flex-direction:column;align-items:center;gap:28px;max-width:100%;animation:iharu-launch-in .6s cubic-bezier(.22,1,.36,1) both}
      #app-launch .launch-logo{display:block;width:clamp(220px,48vw,420px);max-width:78vw;height:auto;overflow:visible}
      #app-launch .launch-track{width:52px;height:2px;overflow:hidden;border-radius:2px;background:#176b5619}
      #app-launch .launch-track:after{content:"";display:block;width:40%;height:100%;background:currentColor;border-radius:inherit;animation:iharu-launch-line 1.4s ease-in-out infinite}
      #app-launch .launch-message{margin:0;color:#6e8078;font-size:13px;font-weight:450;letter-spacing:.025em;text-align:center;line-height:1.8}
      #app-launch .launch-recovery{max-width:300px;text-align:center}
      #app-launch [hidden]{display:none!important}
      #app-launch button{min-height:44px;margin-top:16px;padding:10px 24px;border:1px solid #176b5630;border-radius:12px;color:inherit;background:transparent;font:600 14px system-ui;cursor:pointer}
      #app-launch button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
      #app-launch[data-state=leaving]{opacity:0;transform:scale(1.015);pointer-events:none}
      #app-launch[data-state=error] .launch-track{display:none}
      html[data-theme=dark] #app-launch{background:#10231e;color:#b3d7c4}
      html[data-theme=dark] #app-launch .launch-message{color:#a0b6ab}
      #app-launch[data-motion=reduced] .launch-art,#app-launch[data-motion=reduced] .launch-track:after{animation:none}
      #app-launch[data-motion=reduced]{transition:none}
      @keyframes iharu-launch-in{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
      @keyframes iharu-launch-line{from{transform:translateX(-110%)}to{transform:translateX(360%)}}
      @media(prefers-reduced-motion:reduce){#app-launch,#app-launch .launch-art,#app-launch .launch-track:after{animation:none;transition:none}}
    </style>
  </head>
  <body>

        <span class="launch-track" aria-hidden="true"></span>
        <p class="launch-message" id="launch-message">나의 하루를 준비하고 있어요</p>
        <div class="launch-recovery" id="launch-recovery" hidden><p class="launch-message">연결 상태를 확인한 후 다시 시도해 주세요.</p><button type="button" id="launch-retry">다시 시도</button></div>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script>
      // One launch per document, before the app bundle, route chunks, or APIs load.
      (function(){
        var boot=document.getElementById('app-launch'),root=document.getElementById('root'),html=document.documentElement;
        if(!boot||!root)return;
        var started=performance.now(),closed=false,leaving=false,settle=0,watchdog=0,frame=0;
        var media=window.matchMedia('(prefers-reduced-motion: reduce)'),quiet=false;
        try{var pref=JSON.parse(localStorage.getItem('iharu:appearance')||'null');if(pref&&pref.theme==='dark')html.dataset.theme='dark';quiet=!!(pref&&pref.quiet);if(/^\/(service|guide|notices|blog|login|signup)(\/|$)/.test(location.pathname)&&localStorage.getItem('iharu-public-motion')==='off')quiet=true;}catch(e){}
        function reduced(){return quiet||media.matches;}
        function motion(){boot.dataset.motion=reduced()?'reduced':'full';}
        motion();
        function remove(){
          if(closed)return;closed=true;clearTimeout(settle);clearTimeout(watchdog);cancelAnimationFrame(frame);observer.disconnect();media.removeEventListener('change',motion);window.removeEventListener('error',bundleError,true);window.removeEventListener('pagehide',pageHide);
          root.inert=false;root.removeAttribute('aria-hidden');html.classList.remove('app-launch-active');html.dataset.launchState='ready';boot.remove();
        }
        function reveal(immediate){
          if(closed||leaving)return;leaving=true;clearTimeout(settle);clearTimeout(watchdog);observer.disconnect();root.inert=false;root.removeAttribute('aria-hidden');html.classList.remove('app-launch-active');html.dataset.launchState='leaving';boot.dataset.state='leaving';boot.setAttribute('aria-hidden','true');
          if(immediate||reduced()){remove();return;}setTimeout(remove,300);
        }
        function ready(){return root.childElementCount>0&&!root.querySelector('.loading-state,[data-app-loading]');}
        function check(){
          if(closed||leaving)return;clearTimeout(settle);
          if(!ready())return;
          settle=setTimeout(function(){if(ready())reveal(false);},Math.max(reduced()?0:Math.max(0,720-(performance.now()-started)),100));
        }
        function queue(){cancelAnimationFrame(frame);frame=requestAnimationFrame(check);}
        function recovery(){
          if(closed||leaving)return;boot.dataset.state='error';document.getElementById('launch-message').textContent='화면을 불러오지 못했어요';document.getElementById('launch-recovery').hidden=false;
        }
        function bundleError(event){if(event.target instanceof HTMLScriptElement&&event.target.type==='module'&&!root.childElementCount)recovery();}
        function pageHide(){reveal(true);}
        var observer=new MutationObserver(queue);observer.observe(root,{childList:true,subtree:true});
        media.addEventListener('change',motion);window.addEventListener('error',bundleError,true);window.addEventListener('pagehide',pageHide);
        document.getElementById('launch-retry').addEventListener('click',function(){location.reload();});
        // A slow API yields to the app's own loading/error UI; a missing bundle has a retry screen.
        watchdog=setTimeout(function(){if(root.childElementCount)reveal(false);else recovery();},8000);
        html.dataset.launchState='loading';queue();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <noscript><style>html.app-launch-active{overflow:auto}#app-launch{display:none}</style><p>아이하루를 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>

</html>
